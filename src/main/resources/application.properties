# This project's first application.properties file. Everything else
# (DATABASE_URL, GEMINI_API_KEY, GEMINI_MODEL) is read directly via
# System.getenv() in hand-rolled constructors, not through Spring's
# property mechanism — this file exists specifically for Actuator config.

# Only expose the health endpoint over HTTP. Actuator has other useful
# endpoints (metrics, env, beans) but they can leak real information
# about the running app — and this project has no request-level auth
# enforcement on any endpoint yet, so anything exposed here is
# effectively public to anyone. Keeping this to just 'health' is a
# deliberate, minimal choice, not an oversight.
management.endpoints.web.exposure.include=health

# Never show the detailed breakdown (which indicator failed, why, stack
# traces) to anonymous callers — same reasoning as above. An operator
# checking on Render's dashboard doesn't need this restriction, but a
# random internet caller hitting this URL shouldn't learn anything about
# *why* the database might be down.
management.endpoint.health.show-details=never